name: Iran Bioinformatics News Agent

on:
  schedule:
    # 09:00, 12:00, 15:00, 18:00, 21:00, 00:00 Iran Time (UTC+3:30)
    - cron: '30 5,8,11,14,17,20 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'موضوع یا کلیدواژه انگلیسی/فارسی (اختیاری)'
        required: false
        default: ''
      count:
        description: 'تعداد خبر درخواستی (۱ تا ۱۰)'
        required: false
        default: ''
      custom_query:
        description: 'متن پیام کاربر در تلگرام (اختیاری)'
        required: false
        default: ''
      on_demand:
        description: 'اجرای درخواستی از طریق چت تلگرام'
        required: false
        default: 'false'
      reply_chat_id:
        description: 'آیدی چت درخواست‌کننده (برای ارسال مستقیم پاسخ به همان کاربر)'
        required: false
        default: ''
      status_message_id:
        description: 'شناسه پیام وضعیت برای آپدیت زنده نوار پیشرفت'
        required: false
        default: ''
      game_url:
        description: 'آدرس بازی تقویت حافظه مینی‌اپ تلگرام'
        required: false
        default: ''
      mode:
        description: 'حالت اجرا: news (خبری) یا edu (استودیو آموزشی)'
        required: false
        default: 'news'
      edu_images:
        description: 'ساخت تصویر اسلاید آموزشی (فقط وقتی کاربر صریحاً تصویر بخواهد)'
        required: false
        default: 'false'
      reply_context:
        description: 'متن پیامی که کاربر روی آن ریپلای زده تا همان اصلاح یا تکمیل شود'
        required: false
        default: ''
      aspect_ratio:
        description: 'ابعاد تصویر: post (1080x1350)، story (1080x1920) یا square (1080x1080)'
        required: false
        default: 'post'
      design_spec:
        description: 'مشخصات سبک طراحی، پالت رنگی و تصویر مرجع (JSON)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-news-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run News Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CUSTOM_TOPIC: ${{ github.event.inputs.topic || '' }}
          CUSTOM_COUNT: ${{ github.event.inputs.count || '' }}
          CUSTOM_QUERY: ${{ github.event.inputs.custom_query || '' }}
          ON_DEMAND: ${{ github.event.inputs.on_demand || 'false' }}
          REPLY_CHAT_ID: ${{ github.event.inputs.reply_chat_id || '' }}
          STATUS_MESSAGE_ID: ${{ github.event.inputs.status_message_id || '' }}
          GAME_URL: ${{ github.event.inputs.game_url || '' }}
          MODE: ${{ github.event.inputs.mode || 'news' }}
          EDU_IMAGES: ${{ github.event.inputs.edu_images || 'false' }}
          REPLY_CONTEXT: ${{ github.event.inputs.reply_context || '' }}
          ASPECT_RATIO: ${{ github.event.inputs.aspect_ratio || 'post' }}
          DESIGN_SPEC: ${{ github.event.inputs.design_spec || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen_articles.json
          if [ -n "$(git status --porcelain state/seen_articles.json)" ]; then
            git commit -m "chore: update seen_articles state [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          else
            echo "No state changes to commit."
          fi
