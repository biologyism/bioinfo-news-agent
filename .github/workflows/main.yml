name: Iran Bioinformatics News Agent

on:
  schedule:
    # 09:00, 12:00, 15:00, 18:00, 21:00, 00:00 Iran Time (UTC+3:30)
    - cron: '30 5,8,11,14,17,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-news-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run News Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen_articles.json
          if [ -n "$(git status --porcelain state/seen_articles.json)" ]; then
            git commit -m "chore: update seen_articles state [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          else
            echo "No state changes to commit."
          fi
